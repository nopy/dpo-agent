# dpo-agent Nginx reverse proxy
#
# Three things matter for this config:
#   1. SSE streaming — must disable proxy_buffering and proxy_cache
#      for the /pipeline/stream endpoint (else Nginx buffers the
#      response and the client sees nothing until the pipeline
#      completes).
#   2. Rate limiting — protect against abuse; the API key in the
#      request is the real auth, this is a coarse outer limit.
#   3. Long timeouts — pipeline runs can take 30s+; Nginx's
#      default 60s proxy timeout is fine, but the SSE endpoint
#      must have proxy_read_timeout > 60s to allow the full
#      pipeline to stream.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression (but not for SSE — the chunks are JSON, not text)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript;

    # ─── Rate limiting zone ────────────────────────────────────────────
    # Per-IP rate limit: 10 requests per second for the API,
    # 100 for the static frontend.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

    # ─── Upstream: the FastAPI web service ───────────────────────────
    upstream dpo_web {
        # Single FastAPI process; Nginx handles the rate limiting
        # and load balancing. To scale horizontally, add more
        # backends and Nginx will round-robin.
        server web:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─── HTTP server ───────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # Security headers (a real production deployment should also
        # have TLS — see the docker-compose comment for cert mounting).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Larger client body size for the (future) upload feature.
        client_max_body_size 50m;

        # ─── Healthcheck (unauthenticated, used by docker) ────────────
        location = /healthz {
            proxy_pass http://dpo_web/healthz;
            access_log off;
        }

        # ─── SSE streaming endpoint ──────────────────────────────────
        # CRITICAL: proxy_buffering off. Without this, Nginx buffers
        # the entire SSE response and the client sees nothing until
        # the pipeline completes (or times out at 60s).
        # The /pipeline/stream endpoint runs the 5-stage triage
        # pipeline, which can take 30-60s. We need:
        #   - proxy_buffering off (no buffering)
        #   - proxy_cache off (no caching)
        #   - proxy_read_timeout 600s (10 minutes — generous)
        #   - chunked_transfer_encoding on
        location = /pipeline/stream {
            proxy_pass http://dpo_web/pipeline/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
            # Disable gzip for SSE — gzip is a single-blob transform
            # that buffers the entire response before sending, which
            # destroys streaming. The g(un)zipped module is also
            # not available in all browser streaming pipelines.
            gzip off;
            # Don't add the X-Frame-Options header on streaming
            # responses (some browsers strip SSE if X-Frame-Options
            # is set; same-origin is fine but we want to be safe).
            proxy_hide_header X-Frame-Options;
        }

        # Single-task SSE endpoint (same SSE caveats).
        location = /review/stream {
            proxy_pass http://dpo_web/review/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
            gzip off;
            proxy_hide_header X-Frame-Options;
        }

        # ─── API endpoints (rate-limited) ───────────────────────────
        location /review {
            proxy_pass http://dpo_web;
            limit_req zone=api burst=20 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /pipeline {
            proxy_pass http://dpo_web;
            limit_req zone=api burst=20 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            proxy_pass http://dpo_web;
        }

        # ─── OpenAPI docs (unauthenticated for the demo) ───────────
        location /docs {
            proxy_pass http://dpo_web;
            limit_req zone=api burst=20 nodelay;
        }

        location /openapi.json {
            proxy_pass http://dpo_web;
            limit_req zone=api burst=20 nodelay;
        }

        # ─── Static frontend ─────────────────────────────────────────
        # The FastAPI app serves the web/ directory at /, so this
        # just proxies to it. The static files are served by
        # FastAPI's StaticFiles mount, which is fast.
        location / {
            proxy_pass http://dpo_web;
            limit_req zone=static burst=200 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── HTTPS (uncomment + provide certs in docker/certs/) ──────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # ... same location blocks as the HTTP server above ...
    # }

    # Uncomment to redirect HTTP to HTTPS:
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
