[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo-agent"
version = "0.1.0"
description = "Data Protection Officer contract review agent — tool-using, streaming, two-pass"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hermes Agent"}]
keywords = ["dpo", "gdpr", "contract-review", "llm-agent", "anthropic", "privacy"]

# Runtime dependencies
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
]

# Optional dependencies (install with `pip install dpo-agent[server]`)
[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
langchain = [
    "langchain>=0.3",
    # deepagents is optional — only needed for the example
    "deepagents>=0.2",
]

[project.scripts]
dpo-review = "dpo_agent.cli:main"

[tool.setuptools]
packages = ["dpo_agent"]
include-package-data = true

[tool.setuptools.package-data]
dpo_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
