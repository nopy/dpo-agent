# dpo-agent web — full production stack
#
# 4 services:
#   - web    : FastAPI app + static frontend (the only service exposed
#              directly to the host; in production, Nginx is the only
#              public-facing service)
#   - nginx  : reverse proxy, TLS termination, rate limiting, SSE
#              buffering off (required for streaming responses)
#   - redis  : pub/sub for SSE fan-out across multiple web workers
#   - neo4j  : knowledge graph (optional; kgpipeline falls back to
#              SQLite if Neo4j is not configured)
#
# Usage:
#   1. Copy .env.example to .env and fill in ANTHROPIC_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost (port 80) in a browser
#
# To use a different LLM provider, set OPENAI_API_KEY instead and
# the web service will auto-detect (see dpo_agent.examples.fastapi_server).
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── The web app ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dpo-agent-web:latest
    container_name: dpo-agent-web
    restart: unless-stopped
    # Load .env from the project root (gitignored). Provides
    # the LLM API keys (ANTHROPIC_API_KEY, OPENAI_API_KEY,
    # OPENROUTER_API_KEY, LLM_MODEL, LLM_PROVIDER). The explicit
    # env: block below provides defaults for Neo4j / Redis / log
    # level when .env doesn't set them.
    env_file:
      - .env
    environment:
      # ── LLM provider credentials ──
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}

      # ── Optional: Neo4j for kg_build (kgpipeline integration) ──
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}

      # ── Optional: Redis for SSE pub/sub across workers ──
      REDIS_URL: redis://redis:6379/0

      # ── Data directory (mounted as a volume) ──
      DPO_AGENT_DATA_DIR: /app/data

      # ── Web server config ──
      DPO_AGENT_LOG_LEVEL: ${DPO_AGENT_LOG_LEVEL:-info}
      DPO_AGENT_CORS_ORIGINS: ${DPO_AGENT_CORS_ORIGINS:-*}
    volumes:
      # Persist SQLite graph databases and any per-user data
      - dpo-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - dpo-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Nginx reverse proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dpo-agent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment for TLS:
      # - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for TLS:
      # - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - dpo-net
    healthcheck:
      # Use 127.0.0.1 (IPv4 loopback) explicitly. nginx in the
      # alpine container listens on 0.0.0.0 (IPv4 only), but
      # `localhost` resolves to ::1 first, which yields
      # "Connection refused" from wget. The healthcheck
      # would mark nginx as "unhealthy" forever.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]  
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Redis (SSE pub/sub) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dpo-agent-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly no
        --save ""
    volumes:
      - redis-data:/data
    networks:
      - dpo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Neo4j (knowledge graph) ─────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: dpo-agent-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/devpassword}
      NEO4J_PLUGINS: '[]'
      NEO4J_dbms_security_procedures_unrestricted: apoc
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_dbms_security_auth__enabled: 'true'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    expose:
      - "7474"  # HTTP (browser)
      - "7687"  # Bolt (driver)
    networks:
      - dpo-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "devpassword",
             "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ─── Volumes ────────────────────────────────────────────────────────────
volumes:
  dpo-data:
    name: dpo-agent-data
  redis-data:
    name: dpo-agent-redis
  neo4j-data:
    name: dpo-agent-neo4j-data
  neo4j-logs:
    name: dpo-agent-neo4j-logs

# ─── Network ─────────────────────────────────────────────────────────────
# All services live on a private network. Only Nginx is exposed
# to the host (port 80). The web service is exposed on the network
# but not to the host — Nginx is the only public-facing service.
networks:
  dpo-net:
    name: dpo-agent-net
    driver: bridge
